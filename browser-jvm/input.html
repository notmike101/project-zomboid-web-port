<!doctype html><html lang="en"><meta charset="utf-8"><title>Original keyboard input</title>
<p id="status" role="status">Loading browser JVM</p><canvas id="game" width="128" height="128" aria-label="Keyboard test canvas" tabindex="0"></canvas><button id="outside">Release focus</button>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
<script type="module">
import { keyboardNatives } from './keyboard.js';

const canvas = document.getElementById('game');
const keyboard = keyboardNatives(canvas);

canvas.focus();

try {
    await cheerpjInit({
        version: 17, status: 'none', natives: {
            ...keyboard.natives,
            /**
             * Records an original-code qualification result.
             *
             * @param {unknown} lib - Reserved library context supplied by CheerpJ.
             * @param {string} json - Serialized qualification result.
             */
            Java_probe_CheerpJInput_report(lib, json) {
                const result = JSON.parse(json);

                document.getElementById('status').textContent = json;

                if (result.phase) {
                    globalThis.inputPhase = result.phase;
                }

                if ('pass' in result) {
                    globalThis.probeResult = result;
                }
            },
        },
    });
    const exit = await cheerpjRunMain('probe.CheerpJInput', '/app/input-entry.jar:/app/input-view.jar');

    if (!globalThis.probeResult) {
        throw new Error(`Input main exited without result: ${exit}`);
    }
} catch (error) {
    globalThis.probeResult = { pass: false, error: String(error.stack || error) };
} finally {
    keyboard.dispose();
}
</script></html>
