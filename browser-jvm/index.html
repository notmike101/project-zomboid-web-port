<!doctype html><meta charset="utf-8"><title>Private CheerpJ WebGL vendor backend</title><p>Private technical evaluation. Powered by CheerpJ / Leaning Technologies.</p><canvas id="surface" width="2" height="2"></canvas><pre id="status">Loading</pre>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
<script>
(async()=>{try{
 const canvas=document.getElementById('surface');const gl=canvas.getContext('webgl2',{alpha:true,antialias:false,preserveDrawingBuffer:true});if(!gl)throw Error('WebGL2 unavailable');
 let clears=0,reads=0;const natives={
 async Java_org_lwjgl_opengl_GL11C_glClearColor(lib,r,g,b,a){gl.clearColor(r,g,b,a);},
 async Java_org_lwjgl_opengl_GL11C_glClear(lib,mask){if(mask!==gl.COLOR_BUFFER_BIT)throw Error('Unqualified clear mask');gl.clear(mask);clears++;},
 async Java_probe_CheerpJGL_read(lib,x,y,w,h,format,type,bytes){if(format!==gl.RGBA||type!==gl.UNSIGNED_BYTE)throw Error('Unqualified read format');const out=new Uint8Array(bytes.length);gl.readPixels(x,y,w,h,format,type,out);const error=gl.getError();if(error!==gl.NO_ERROR)throw Error('WebGL error '+error);for(let i=0;i<out.length;i++)bytes[i]=out[i]>127?out[i]-256:out[i];reads++;},
 async Java_probe_CheerpJGL_report(lib,json){window.probeResult={...JSON.parse(json),backend:{clears,reads,version:gl.getParameter(gl.VERSION),renderer:gl.getParameter(gl.RENDERER)}};document.getElementById('status').textContent=JSON.stringify(window.probeResult);}
 };
 const shaders=new Map(),programs=new Map(),locations=new Map(),locationOwners=new Map(),textures=new Map();let next=1;
 function object(map,id){if(id===0)return null;if(!map.has(id))throw Error('Unknown or deleted GL handle '+id);return map.get(id);}
 function add(map,value){if(!value)throw Error('WebGL object allocation failed');const id=next++;map.set(id,value);return id;}
 const hooks={
 glCreateShader:(type)=>add(shaders,gl.createShader(type)),glCompileShader:(id)=>gl.compileShader(object(shaders,id)),glDeleteShader:(id)=>{gl.deleteShader(object(shaders,id));shaders.delete(id);},
 glCreateProgram:()=>add(programs,gl.createProgram()),glAttachShader:(p,s)=>gl.attachShader(object(programs,p),object(shaders,s)),glLinkProgram:(p)=>gl.linkProgram(object(programs,p)),glUseProgram:(p)=>gl.useProgram(object(programs,p)),glDeleteProgram:(p)=>{gl.deleteProgram(object(programs,p));programs.delete(p);for(const [id,owner] of locationOwners)if(owner===p){locationOwners.delete(id);locations.delete(id);}},
 glGetShaderi:(s,p)=>{if(p!==gl.COMPILE_STATUS)throw Error('Unqualified shader status enum '+p);return Number(gl.getShaderParameter(object(shaders,s),p));},
 glGetProgrami:(s,p)=>{if(p!==gl.LINK_STATUS)throw Error('Unqualified program status enum '+p);return Number(gl.getProgramParameter(object(programs,s),p));},
 glGetShaderInfoLog:(s,max)=>(gl.getShaderInfoLog(object(shaders,s))||'').slice(0,Math.max(0,max-1)),glGetProgramInfoLog:(s,max)=>(gl.getProgramInfoLog(object(programs,s))||'').slice(0,Math.max(0,max-1)),
 glUniform4f:(l,r,g,b,a)=>gl.uniform4f(l===-1?null:object(locations,l),r,g,b,a)
 };
 for(const [name,fn] of Object.entries(hooks))natives['Java_org_lwjgl_opengl_GL20C_'+name]=async(lib,...args)=>{return fn(...args);};
 natives.Java_probe_CheerpJGL_shaderText=async(lib,s,text)=>gl.shaderSource(object(shaders,s),String(text));
 natives.Java_probe_CheerpJGL_locationText=async(lib,p,name)=>{const value=gl.getUniformLocation(object(programs,p),String(name));if(value===null)return -1;const id=add(locations,value);locationOwners.set(id,p);return id;};
 natives.Java_org_lwjgl_opengl_GL11C_glGenTextures=async()=>add(textures,gl.createTexture());
 natives.Java_org_lwjgl_opengl_GL11C_glBindTexture=async(lib,t,id)=>gl.bindTexture(t,object(textures,id));
 natives.Java_org_lwjgl_opengl_GL11C_glDeleteTextures=async(lib,id)=>{gl.deleteTexture(object(textures,id));textures.delete(id);};
 natives.Java_org_lwjgl_opengl_GL11C_glTexParameteri=async(lib,t,p,v)=>gl.texParameteri(t,p,v);
 natives.Java_probe_CheerpJGL_textureBytes=async(lib,t,level,internal,w,h,border,format,type,bytes)=>{if(format!==gl.RGBA||type!==gl.UNSIGNED_BYTE)throw Error('Unqualified texture format');gl.texImage2D(t,level,internal,w,h,border,format,type,new Uint8Array(bytes.buffer,bytes.byteOffset,bytes.byteLength));};
 natives.Java_org_lwjgl_opengl_GL11C_glDrawArrays=async(lib,mode,first,count)=>gl.drawArrays(mode,first,count);
 natives.Java_org_lwjgl_opengl_GL11C_glViewport=async(lib,x,y,w,h)=>gl.viewport(x,y,w,h);
 natives.Java_probe_CheerpJGL_resize=async(lib,w,h)=>{canvas.width=w;canvas.height=h;};
 natives.Java_probe_CheerpJGL_validatePng=async(lib,bytes,w,h)=>{const response=await fetch('/menu.png');if(!response.ok)throw Error('PNG asset unavailable');const bitmap=await createImageBitmap(await response.blob(),{premultiplyAlpha:'none',colorSpaceConversion:'none'});try{if(bitmap.width!==w||bitmap.height!==h)throw Error('Independent PNG dimensions differ');const c=new OffscreenCanvas(w,h);const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(bitmap,0,0);const actual=ctx.getImageData(0,0,w,h).data;for(let i=0;i<actual.length;i++)if(actual[i]!==(bytes[i]&255))throw Error('Independent PNG byte differs '+i);}finally{bitmap.close();}};
 const originalReport=natives.Java_probe_CheerpJGL_report;
 natives.Java_probe_CheerpJGL_report=async(lib,json)=>{const live={shaders:shaders.size,programs:programs.size,textures:textures.size,uniformLocations:locations.size};await originalReport(lib,json);window.probeResult.liveResources=live;if(Object.values(live).some(v=>v!==0))window.probeResult.pass=false;};

 await cheerpjInit({version:17,status:'none',natives});await cheerpjRunMain('probe.CheerpJGL','/app/view.jar');if(!window.probeResult)throw Error('No result');
}catch(error){window.probeResult={pass:false,error:String(error.stack||error)};document.getElementById('status').textContent=JSON.stringify(window.probeResult);}})();
</script>
