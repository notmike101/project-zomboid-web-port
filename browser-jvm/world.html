<!doctype html><html lang="en"><meta charset="utf-8"><title>Original player input qualification</title>
<p id="status" role="status">Loading original browser world</p>
<canvas id="game" width="128" height="128" tabindex="0" aria-label="Original player keyboard input"></canvas>
<p>This qualification reads original player input. It does not move or render the player.</p>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
<script type="module">
import { keyboardNatives } from './keyboard.js';

const canvas = document.getElementById('game');
const keyboard = keyboardNatives(canvas);

canvas.focus();
globalThis.stageResults = [];

try {
    await cheerpjInit({
        version: 17, status: 'none', javaProperties: ['user.dir=/files/work'], natives: {
            ...keyboard.natives,
            /**
             * Records an original-code qualification result.
             *
             * @param {unknown} lib - Reserved library context supplied by CheerpJ.
             * @param {string} json - Serialized qualification result.
             */
            Java_probe_CheerpJWorld_report(lib, json) {
                const result = JSON.parse(json);

                globalThis.stageResults.push(result);
                document.getElementById('status').textContent = json;

                if (result.phase) {
                    globalThis.inputPhase = result.phase;
                }

                if ('pass' in result) {
                    globalThis.probeResult = result;
                }
            },
        },
    });
    const exit = await cheerpjRunMain('probe.CheerpJWorld', '/app/world-entry.jar:/app/float-bridge.jar:/app/memory-bridge.jar:/app/world-view.jar');

    if (!globalThis.probeResult) {
        throw new Error(`World main exited without result: ${exit}`);
    }
} catch (error) {
    globalThis.probeResult = { pass: false, error: String(error.stack || error) };
} finally {
    keyboard.dispose();
}
</script></html>
